<title>Proyecto transformación</title>
<style>
:root { --bg: #F3F6F4; --surface: #FFFFFF; --fg: #14201B; --muted: #5B6B64; --line: #DCE4E0; --accent: #1E7356; --crit: #B3261E; }
@media (prefers-color-scheme: dark) { :root { --bg: #0F1513; --surface: #17201C; --fg: #E6EEEA; --muted: #9AABA3; --line: #28342F; --accent: #5CC49B; --crit: #F2B8B5; color-scheme: dark; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding-inline: 16px; box-sizing: border-box; }
form { width: 100%; max-width: 340px; display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; box-sizing: border-box; }
h1 { margin: 0; font-size: 1.5rem; }
p { margin: 0; color: var(--muted); font-size: .9rem; }
input { font: inherit; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
button { font: inherit; font-weight: 600; padding: 11px; border: 0; border-radius: 10px; background: var(--accent); color: var(--surface); cursor: pointer; }
label { display: flex; gap: 8px; align-items: center; font-size: .9rem; color: var(--muted); }
#err { color: var(--crit); }
</style></head>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY_NAME = "plan-clave-" + SALT;
async function decryptWith(rawKey) {
  const key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(IV) }, key, b64(CT));

}
async function deriveRaw(pw) {
